name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # only used to attach the zip to a release on v* tags
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install tesseract -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 20
          }
          $dir = @("$env:ProgramFiles\Tesseract-OCR", "${env:ProgramFiles(x86)}\Tesseract-OCR") |
            Where-Object { Test-Path "$_\tesseract.exe" } | Select-Object -First 1
          if (-not $dir) { throw "Tesseract install not found" }
          "TESS_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$dir\tesseract.exe" --version

      - name: Unit tests
        shell: pwsh
        run: |
          $env:PDFPARSER_TESSERACT = "$env:TESS_DIR\tesseract.exe"
          python -m pytest -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean pdfparser.spec

      - name: Add Tesseract, README and notices
        shell: pwsh
        run: |
          ./packaging/bundle_tesseract.ps1 -Source $env:TESS_DIR -Dest dist/PDFParser/tesseract
          Copy-Item packaging/README.txt, packaging/THIRD_PARTY_NOTICES.txt dist/PDFParser/

      - name: Hide the system Tesseract (only the bundled copy may be used from here on)
        shell: pwsh
        run: Rename-Item -Path $env:TESS_DIR -NewName "Tesseract-OCR-hidden"

      - name: Smoke test the built app
        run: |
          python tests/make_fixtures.py smoke/fixtures
          python tests/smoke_test.py dist/PDFParser smoke/fixtures smoke/out --expect-bundled

      - name: Upload portable app
        uses: actions/upload-artifact@v5
        with:
          name: PDFParser-windows-x64
          path: dist/PDFParser
          if-no-files-found: error

      - name: Attach zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/PDFParser -DestinationPath PDFParser-windows-x64.zip
          gh release create $env:GITHUB_REF_NAME PDFParser-windows-x64.zip --generate-notes --title "PDF Parser $env:GITHUB_REF_NAME"
